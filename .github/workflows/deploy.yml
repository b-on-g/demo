name: $bog_demo

permissions: write-all

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    # modules не указан — собирается сам пак bog/demo, каталог демок.
    # Сами демки приезжают из своих репозиториев по include в demo.meta.tree.
    - uses: hyoo-ru/mam_build@master2
      with:
        package: 'bog/demo'

    - uses: hyoo-ru/gh-deploy@v4.4.1
      if: github.ref == 'refs/heads/main'
      with:
        folder: 'bog/demo/-'
